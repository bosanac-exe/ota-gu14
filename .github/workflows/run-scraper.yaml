name: Run Weekly Scraper

on:
  repository_dispatch:
    types: [trigger-scraper]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 tqdm openpyxl

      - name: Run Scraper Script
        run: python rankextract.py

      - name: Commit and Push Master File
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update master.xlsx via scheduled cron run"
          file_pattern: master.xlsx
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
