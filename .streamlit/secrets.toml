# Example Streamlit secrets for streamlit-authenticator
# NOTE: Do NOT commit real secrets with plaintext passwords. Replace placeholders before use.

[auth]
cookie_key = "REPLACE_WITH_A_LONG_RANDOM_STRING"
cookie_name = "ota_u14_auth"
expiry_days = 7

[auth.credentials.usernames.coach]
name = "Coach"
password = "<PASTE_HASHED_PASSWORD_HERE>"

# To generate a hashed password for streamlit-authenticator, run in a Python REPL:
# >>> import streamlit_authenticator as stauth
# >>> hashed = stauth.Hasher(['YourPassword']).generate()
# >>> print(hashed)
# Copy the resulting string value into the password field above.
